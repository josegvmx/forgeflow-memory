name: CI

# Runs on:
#   • Every push to any branch (includes the first push that creates a branch)
#   • Explicit branch creation via the GitHub UI / API (no commit required)
#
# The `eval` job is gated to main/master only and requires secrets.
# Add VOYAGE_API_KEY and ANTHROPIC_API_KEY in repo Settings → Secrets → Actions.

on:
  push:
    branches: ['**']
  create: # fires on branch creation even without a push (GitHub UI / API)

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # CI — runs on every push and every branch creation
  # ──────────────────────────────────────────────────────────────────────────
  ci:
    name: Type-check · Unit tests · Build
    # Skip when `create` fires for tags (we only care about branches)
    if: github.event_name == 'push' || github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # Eval — RAG golden-set eval, runs on main/master pushes only
  # Requires secrets: VOYAGE_API_KEY (or OPENAI_API_KEY) + ANTHROPIC_API_KEY
