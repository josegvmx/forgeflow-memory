[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Plain command on purpose: Railway runs a Dockerfile service's start command without a shell, so
# `a && b` would run only `a` (npm passed the rest as arguments, exited 0, the server never started).
# The server applies schema.sql and the idempotent seed in the background once it is listening
# (src/api/server.ts → scripts/migrate.ts, which retries while the database isn't reachable yet).
startCommand = "node dist/api/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
