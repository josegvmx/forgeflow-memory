[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Migrate first (schema.sql is idempotent). If it fails the server never starts, the new
# deployment fails its health check, and Railway keeps the previous one running.
startCommand = "npm run db:migrate && node dist/api/server.js"
healthcheckPath = "/health"
# The migration may wait up to ~45 s for the database at container start (see src/store/migrate.ts).
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
