<svg viewBox="0 0 780 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" width="720">
  <title>ForgeFlow architecture — forgeflow-memory data flow</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="780" height="680" fill="white"/>

  <!-- Legend -->
  <line x1="20" y1="19" x2="40" y2="19" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="48" y="23" font-size="11" fill="#6b7280">implemented</text>
  <line x1="140" y1="19" x2="160" y2="19" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>
  <text x="168" y="23" font-size="11" fill="#9ca3af">planned</text>
  <text x="240" y="23" font-size="11" fill="#6b7280">🔒 = admin-only (ADMIN_TOKEN)</text>

  <!-- forgeflow-sim -->
  <rect x="240" y="44" width="300" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">forgeflow-sim</text>
  <text x="390" y="84" text-anchor="middle" font-size="11" fill="#3b82f6">Heuristic agent · AI agent · Scenario runner</text>
  <text x="390" y="100" text-anchor="middle" font-size="11" fill="#3b82f6">Exports each run as archive JSON</text>
  <text x="390" y="115" text-anchor="middle" font-size="10" fill="#60a5fa">(Memory button · npm run export)</text>

  <!-- sim → ingest: exported archives (implemented) -->
  <line x1="390" y1="124" x2="390" y2="166" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="397" y="134" width="236" height="18" rx="3" fill="white"/>
  <text x="402" y="147" font-size="10" fill="#374151">archive JSON → startup seed · POST /ingest 🔒</text>

  <!-- Ingest Pipeline -->
  <rect x="100" y="168" width="580" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="390" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">forgeflow-memory — Ingest Pipeline</text>
  <text x="390" y="203" text-anchor="middle" font-size="10" fill="#16a34a">one chunk per event → embed (Voyage AI / OpenAI, 1536-d) → upsert to pgvector</text>
  <text x="390" y="215" text-anchor="middle" font-size="10" fill="#16a34a">single events also arrive via POST /events 🔒</text>

  <!-- ingest → db -->
  <line x1="390" y1="220" x2="390" y2="246" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect x="220" y="248" width="340" height="58" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/>
  <text x="390" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">PostgreSQL + pgvector</text>
  <text x="390" y="284" text-anchor="middle" font-size="10" fill="#6b7280">reasoning_events: HNSW (cosine) · B-tree on scenario_id</text>
  <text x="390" y="298" text-anchor="middle" font-size="10" fill="#6b7280">recommendations: cache table</text>

  <!-- db → query & summary -->
  <line x1="300" y1="306" x2="210" y2="342" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="306" x2="570" y2="342" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Query + Synthesis -->
  <rect x="60" y="344" width="280" height="72" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="200" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#7e22ce">Query + Synthesis</text>
  <text x="200" y="380" text-anchor="middle" font-size="10" fill="#9333ea">POST /query</text>
  <text x="200" y="395" text-anchor="middle" font-size="10" fill="#9333ea">filtered cosine top-K → Claude Haiku / Ollama</text>
  <text x="200" y="409" text-anchor="middle" font-size="10" fill="#9333ea">→ answer grounded in retrieved events</text>

  <!-- Scenario Summary -->
  <rect x="440" y="344" width="280" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="580" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">Scenario Summary</text>
  <text x="580" y="380" text-anchor="middle" font-size="10" fill="#ea580c">GET /scenarios/:id/summary</text>
  <text x="580" y="395" text-anchor="middle" font-size="10" fill="#ea580c">failures · reroutes · recoveries</text>
  <text x="580" y="409" text-anchor="middle" font-size="10" fill="#ea580c">+ LLM-written heuristic vs AI comparison</text>

  <!-- query → recommend -->
  <line x1="200" y1="416" x2="200" y2="450" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Recommend -->
  <rect x="60" y="452" width="280" height="62" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="200" y="472" text-anchor="middle" font-size="12" font-weight="600" fill="#7e22ce">POST /recommend</text>
  <text x="200" y="488" text-anchor="middle" font-size="10" fill="#9333ea">past similar failures → routing recommendation</text>
  <text x="200" y="503" text-anchor="middle" font-size="10" fill="#9333ea">cached by (scenario, machine, failure type, mode)</text>

  <!-- Audit -->
  <rect x="440" y="452" width="280" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="580" y="472" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">Scenario Audit · POST /audit 🔒</text>
  <text x="580" y="488" text-anchor="middle" font-size="10" fill="#ea580c">failure + adjustments + outcome → Claude Haiku</text>
  <text x="580" y="503" text-anchor="middle" font-size="10" fill="#ea580c">mode-consistency score (0–1) + deviations</text>

  <!-- planned: recommendations back to sim agents -->
  <path d="M60,483 Q22,483 22,300 Q22,120 236,94" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#arrow-dashed)" stroke-dasharray="4,3"/>
  <rect x="10" y="232" width="24" height="132" fill="white"/>
  <text x="26" y="298" text-anchor="middle" font-size="10" fill="#9ca3af" transform="rotate(-90,26,298)">recommendations to agents</text>

  <!-- planned: audit scores → genetic-inheritance -->
  <line x1="580" y1="514" x2="500" y2="556" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>
  <rect x="548" y="527" width="108" height="16" rx="3" fill="white"/>
  <text x="552" y="539" font-size="10" fill="#9ca3af">scores as fitness</text>

  <!-- genetic-inheritance (planned) -->
  <rect x="240" y="558" width="300" height="52" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="390" y="580" text-anchor="middle" font-size="12" font-weight="600" fill="#9ca3af">genetic-inheritance (planned)</text>
  <text x="390" y="596" text-anchor="middle" font-size="10" fill="#9ca3af">evolves scenario configs</text>

  <!-- planned: evolved configs → sim -->
  <path d="M540,584 Q762,584 762,320 Q762,110 544,94" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#arrow-dashed)" stroke-dasharray="4,3"/>
  <rect x="746" y="262" width="24" height="96" fill="white"/>
  <text x="758" y="310" text-anchor="middle" font-size="10" fill="#9ca3af" transform="rotate(90,758,310)">evolved configs</text>

  <!-- Footer: public vs admin surface -->
  <text x="390" y="640" text-anchor="middle" font-size="10" fill="#6b7280">Public demo: /query, /recommend, summary — 10 req/h per IP · 200/day · 4 concurrent LLM calls (cached /recommend is free)</text>
  <text x="390" y="656" text-anchor="middle" font-size="10" fill="#6b7280">Admin-only 🔒: /ingest, /events, /scenarios, /audit — disabled when ADMIN_TOKEN is unset</text>
</svg>
