<svg viewBox="0 0 780 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" width="720">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Legend -->
  <line x1="20" y1="19" x2="32" y2="19" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="38" y="24" font-size="11" fill="#6b7280">data flow</text>
  <line x1="172" y1="19" x2="184" y2="19" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="190" y="24" font-size="11" fill="#6b7280">feedback / score</text>
  <line x1="278" y1="19" x2="290" y2="19" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>
  <text x="296" y="24" font-size="11" fill="#9ca3af">planned</text>

  <!-- forgeflow-sim -->
  <rect x="240" y="50" width="300" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">forgeflow-sim</text>
  <text x="390" y="92" text-anchor="middle" font-size="11" fill="#3b82f6">Heuristic agent</text>
  <text x="390" y="108" text-anchor="middle" font-size="11" fill="#3b82f6">AI agent</text>
  <text x="390" y="124" text-anchor="middle" font-size="11" fill="#3b82f6">Scenario runner</text>

  <!-- arrow sim → ingest -->
  <line x1="390" y1="140" x2="390" y2="168" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="310" y="148" width="160" height="18" rx="3" fill="white"/>
  <text x="390" y="161" text-anchor="middle" font-size="10" fill="#374151">POST /ingest  (archive JSON)</text>

  <!-- Ingest Pipeline -->
  <rect x="100" y="170" width="580" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="390" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">forgeflow-memory — Ingest Pipeline</text>
  <text x="390" y="204" text-anchor="middle" font-size="10" fill="#16a34a">chunk → embed (Voyage AI / OpenAI) → upsert to pgvector</text>

  <!-- arrow ingest → db -->
  <line x1="390" y1="214" x2="390" y2="242" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect x="240" y="244" width="300" height="52" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/>
  <text x="390" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">PostgreSQL + pgvector</text>
  <text x="390" y="282" text-anchor="middle" font-size="10" fill="#6b7280">HNSW index · B-tree on scenario_id</text>

  <!-- arrows db → query & audit -->
  <line x1="310" y1="296" x2="200" y2="336" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="296" x2="580" y2="336" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Query + Synthesis -->
  <rect x="60" y="338" width="280" height="72" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="200" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#7e22ce">Query + Synthesis</text>
  <text x="200" y="374" text-anchor="middle" font-size="10" fill="#9333ea">POST /query</text>
  <text x="200" y="390" text-anchor="middle" font-size="10" fill="#9333ea">cosine search → Claude Haiku / Ollama</text>
  <text x="200" y="404" text-anchor="middle" font-size="10" fill="#9333ea">→ recommendation string</text>

  <!-- Scenario Audit -->
  <rect x="440" y="338" width="280" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="580" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">Scenario Audit</text>
  <text x="580" y="374" text-anchor="middle" font-size="10" fill="#ea580c">POST /events · POST /audit</text>
  <text x="580" y="390" text-anchor="middle" font-size="10" fill="#ea580c">Claude Haiku scores mode consistency</text>
  <text x="580" y="404" text-anchor="middle" font-size="10" fill="#ea580c">0–1 score + deviations</text>

  <!-- arrows → recommend & summary -->
  <line x1="200" y1="410" x2="200" y2="448" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="410" x2="580" y2="448" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Recommend -->
  <rect x="60" y="450" width="280" height="56" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="200" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="#7e22ce">POST /recommend</text>
  <text x="200" y="486" text-anchor="middle" font-size="10" fill="#9333ea">RAG-based failure recommendation</text>
  <text x="200" y="500" text-anchor="middle" font-size="10" fill="#9333ea">cached by (scenario, machine, mode)</text>

  <!-- Summary -->
  <rect x="440" y="450" width="280" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="580" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">GET /scenarios/:id/summary</text>
  <text x="580" y="486" text-anchor="middle" font-size="10" fill="#ea580c">all events + mode comparison</text>
  <text x="580" y="500" text-anchor="middle" font-size="10" fill="#ea580c">heuristic score vs AI score</text>

  <!-- feedback loop recommend → sim (orange) -->
  <path d="M60,478 Q20,478 20,300 Q20,140 240,100" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)" stroke-dasharray="5,3"/>
  <text x="26" y="305" font-size="10" fill="#f97316" transform="rotate(-90,26,305)">recommendation</text>

  <!-- fitness signal summary → sim (planned) -->
  <path d="M720,478 Q760,478 760,300 Q760,140 540,100" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#arrow-dashed)" stroke-dasharray="4,3"/>
  <text x="754" y="305" font-size="10" fill="#9ca3af" transform="rotate(90,754,305)">fitness signal (planned)</text>

  <!-- genetic-inheritance (planned) -->
  <rect x="240" y="540" width="300" height="52" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="390" y="562" text-anchor="middle" font-size="12" font-weight="600" fill="#9ca3af">genetic-inheritance</text>
  <text x="390" y="578" text-anchor="middle" font-size="10" fill="#9ca3af">uses audit scores as fitness · evolves configs</text>

  <!-- arrows → genetic -->
  <line x1="580" y1="506" x2="490" y2="540" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>
  <line x1="200" y1="506" x2="290" y2="540" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>
</svg>
